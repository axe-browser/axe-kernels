name: Kernel Catalog Verification

on: [push, pull_request]

jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Verify distribution tools
      run: python3 -m unittest discover -s tests -q
